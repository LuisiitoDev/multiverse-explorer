name: Agent iteration

# One implement ► CI ► review cycle on the canonical PR. Called by
# agent-pipeline.yml at most twice (attempt 1, then one bounded remediation).
on:
  workflow_call:
    inputs:
      issue_number:
        type: string
        required: true
      pr_number:
        type: string
        required: true
      head_sha:
        description: PR head this iteration starts from
        type: string
        required: true
      attempt:
        type: string
        required: true
      approval_json:
        description: Hash-bound approval record from the pipeline approve job
        type: string
        required: true
      remediation_json:
        description: Reviewer findings to fix (attempt 2 only)
        type: string
        default: '[]'
    outputs:
      decision:
        value: ${{ jobs.review-gate.outputs.decision }}
      findings_json:
        value: ${{ jobs.review-gate.outputs.findings_json }}
      head_sha:
        value: ${{ jobs.implement-gate.outputs.head_sha }}
      blocker:
        value: ${{ jobs.implement-gate.outputs.blocker || jobs.review-gate.outputs.blocker }}

permissions: {}

jobs:
  ids:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    outputs:
      implementer: ${{ steps.ids.outputs.implementer }}
      reviewer: ${{ steps.ids.outputs.reviewer }}
    steps:
      - name: Derive worker identities and mark phase
        id: ids
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          ATTEMPT: ${{ inputs.attempt }}
        with:
          script: |
            const crypto = require('crypto');
            const { owner, repo } = context.repo;
            const issue = Number(process.env.ISSUE_NUMBER);
            // Unique per run/attempt/worker: schemas require a 32-hex transition_id
            // and gh-aw derives distinct artifact prefixes from distinct inputs.
            for (const worker of ['implementer', 'reviewer']) {
              core.setOutput(worker, crypto.createHash('md5')
                .update(`${context.runId}:${process.env.GITHUB_RUN_ATTEMPT}:${worker}:${process.env.ATTEMPT}`).digest('hex'));
            }
            const labels = (await github.paginate(github.rest.issues.listLabelsOnIssue, { owner, repo, issue_number: issue, per_page: 100 }))
              .map((label) => label.name).filter((name) => name.startsWith('agent:'));
            for (const name of labels) await github.rest.issues.removeLabel({ owner, repo, issue_number: issue, name });
            await github.rest.issues.addLabels({ owner, repo, issue_number: issue, labels: ['agent:implementing'] });

  implement:
    needs: ids
    permissions:
      actions: read
      contents: write
      issues: write
      pull-requests: write
    uses: ./.github/workflows/agent-implement.lock.yml
    with:
      issue_number: ${{ inputs.issue_number }}
      pr_number: ${{ inputs.pr_number }}
      expected_head_sha: ${{ inputs.head_sha }}
      transition_id: ${{ needs.ids.outputs.implementer }}
      attempt: ${{ inputs.attempt }}
      approval_json: ${{ inputs.approval_json }}
      remediation_json: ${{ inputs.remediation_json }}
    secrets: inherit

  implement-gate:
    needs: [ids, implement]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      pull-requests: read
    outputs:
      head_sha: ${{ steps.gate.outputs.head_sha }}
      head_ref: ${{ steps.gate.outputs.head_ref }}
      blocker: ${{ steps.gate.outputs.blocker }}
    steps:
      - name: Check out trusted schemas
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: docs/agent-handoffs
          persist-credentials: false
      - name: Install JSON Schema validator
        run: npm install --no-save --no-audit --no-fund --ignore-scripts --prefix "$RUNNER_TEMP/agent-deps" ajv@8.17.1 ajv-formats@3.0.1
      - name: Validate implementation handoff
        id: gate
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          PR_NUMBER: ${{ inputs.pr_number }}
          START_HEAD_SHA: ${{ inputs.head_sha }}
          PUBLISHED_HEAD_SHA: ${{ needs.implement.outputs.push_commit_sha }}
          TRANSITION_ID: ${{ needs.ids.outputs.implementer }}
          APPROVAL_JSON: ${{ inputs.approval_json }}
        with:
          script: |
            const fs = require('fs');
            const crypto = require('crypto');
            const deps = `${process.env.RUNNER_TEMP}/agent-deps/node_modules`;
            const Ajv = require(`${deps}/ajv/dist/2020`); const formats = require(`${deps}/ajv-formats`);
            const { owner, repo } = context.repo;
            const env = process.env;
            const issue = Number(env.ISSUE_NUMBER);
            const approval = JSON.parse(env.APPROVAL_JSON);
            const fail = (message) => { throw new Error(message); };
            const sha256 = (bytes) => crypto.createHash('sha256').update(bytes).digest('hex');
            const file = async (path, ref) => {
              const { data } = await github.rest.repos.getContent({ owner, repo, path, ref });
              if (Array.isArray(data) || data.type !== 'file' || data.encoding !== 'base64' || data.size > 2 * 1024 * 1024)
                fail(`Not a bounded regular file: ${path}`);
              return Buffer.from(data.content, 'base64');
            };
            const pathRule = (p) => {
              if (typeof p !== 'string' || !p || p.includes('\\') ||
                  p.split('/').some((part) => ['', '.', '..'].includes(part)) ||
                  /[*?\[]/.test(p.endsWith('/**') ? p.slice(0, -3) : p)) fail(`Invalid scope path: ${p}`);
              return p;
            };
            const matches = (p, rule) => rule.endsWith('/**') ? p.startsWith(rule.slice(0, -2)) : p === rule;
            const validate = (doc, name) => {
              const ajv = new (Ajv.default || Ajv)({ allErrors: true, strict: false });
              (formats.default || formats)(ajv);
              const check = ajv.compile(JSON.parse(fs.readFileSync(`docs/agent-handoffs/${name}`, 'utf8')));
              if (!check(doc)) fail(`Invalid ${name}: ${ajv.errorsText(check.errors)}`);
            };
            try {
              if (!/^[0-9a-f]{40}$/.test(env.PUBLISHED_HEAD_SHA || ''))
                fail('Safe-output publication was skipped or failed: no push_commit_sha returned. Inspect implement / safe_outputs; local commits and queued intents are not publication evidence.');
              const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: Number(env.PR_NUMBER) });
              const head = pr.head.sha;
              if (pr.state !== 'open' || pr.base.ref !== 'main' ||
                  pr.head.repo?.full_name.toLowerCase() !== `${owner}/${repo}`.toLowerCase() ||
                  !new RegExp(`^agent-plan/issue-${issue}(?:-[A-Za-z0-9_-]+)?$`).test(pr.head.ref)) fail('Canonical PR identity changed');
              const { data: ancestry } = await github.rest.repos.compareCommitsWithBasehead({ owner, repo, basehead: `${env.START_HEAD_SHA}...${head}` });
              if (pr.state !== 'open' || ancestry.status !== 'ahead') fail('Implementer did not publish new commits on the canonical PR');
              if (head !== env.PUBLISHED_HEAD_SHA) {
                const { data: extra } = await github.rest.repos.compareCommitsWithBasehead({ owner, repo, basehead: `${env.PUBLISHED_HEAD_SHA}...${head}` });
                // gh-aw may add an empty commit to trigger CI. No additional file
                // change may sneak in after the verified publisher revision.
                if (extra.status !== 'ahead' || !Array.isArray(extra.files) || extra.files.length)
                  fail('PR content changed after safe-output publication');
              }
              const approvedRaw = await file(`specs/issue-${issue}/planner-handoff.json`, approval.approved_head_sha);
              const handoff = JSON.parse(approvedRaw);
              validate(handoff, 'contract-v1.schema.json');
              if (handoff.status !== 'PLANNED' || handoff.issue.number !== issue || !handoff.execution_scope ||
                  handoff.plan.plan_sha256 !== approval.plan_sha256 || handoff.spec.spec_sha256 !== approval.spec_sha256 ||
                  handoff.base_commit !== approval.base_commit) fail('Approved planner scope/identity mismatch');
              if (!approvedRaw.equals(await file(`specs/issue-${issue}/planner-handoff.json`, head))) fail('Approved handoff changed');
              for (const [kind, hash] of [['spec', approval.spec_sha256], ['plan', approval.plan_sha256]]) {
                if (sha256(await file(`specs/issue-${issue}/${kind}.md`, head)) !== hash) fail(`Approved ${kind} changed`);
              }
              const scope = handoff.execution_scope;
              for (const rule of [...scope.allowed_paths, ...scope.denied_paths]) pathRule(rule);
              if (!Array.isArray(ancestry.files) || ancestry.files.length >= 300) fail('Incomplete implementation diff');
              const metadata = [`specs/issue-${issue}/tasks.md`, `specs/issue-${issue}/implementation-handoff.json`];
              for (const changed of ancestry.files) {
                for (const p of new Set([changed.filename, changed.previous_filename || changed.filename])) {
                  pathRule(p);
                  if (p.startsWith('.github/workflows/')) fail(`Workflow changes require a human: ${p}`);
                  if (!metadata.includes(p) && (scope.denied_paths.some((r) => matches(p, r)) ||
                      !scope.allowed_paths.some((r) => matches(p, r)))) fail(`Published path outside approved scope: ${p}`);
                }
              }
              const report = JSON.parse(await file(`specs/issue-${issue}/implementation-handoff.json`, head));
              validate(report, 'implementation.schema.json');
              if (report.transition_id !== env.TRANSITION_ID || report.issue_number !== issue || report.pr_number !== pr.number ||
                  report.plan_sha256 !== approval.plan_sha256 || report.base_commit !== approval.base_commit)
                fail('Implementation report identity does not match this iteration');
              if (report.status !== 'IMPLEMENTED') {
                const missing = report.local_validation.filter((check) => check.result !== 'passed').map((check) => check.command);
                fail(`Implementer reported ${report.status}; pending checks: ${missing.join(', ') || 'see deviations'}. Publication is not completion; CI/review remains blocked.`);
              }
              if (!report.local_validation.length || !report.local_validation.every((check) => check.result === 'passed'))
                fail('Implementation lacks passing local validation evidence');
              core.setOutput('head_sha', head);
              core.setOutput('head_ref', pr.head.ref);
              const labels = (await github.paginate(github.rest.issues.listLabelsOnIssue, { owner, repo, issue_number: issue, per_page: 100 }))
                .map((label) => label.name).filter((name) => name.startsWith('agent:'));
              for (const name of labels) await github.rest.issues.removeLabel({ owner, repo, issue_number: issue, name });
              await github.rest.issues.addLabels({ owner, repo, issue_number: issue, labels: ['agent:reviewing'] });
            } catch (error) {
              core.setOutput('blocker', String(error.message).slice(0, 1000));
              core.setFailed(error.message);
            }

  # Required CI on the exact remote head the implementer published.
  ci:
    needs: implement-gate
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.implement-gate.outputs.head_sha }}
      pr_number: ${{ inputs.pr_number }}
      head_ref: ${{ needs.implement-gate.outputs.head_ref }}
    secrets: inherit

  review:
    needs: [ids, implement-gate, ci]
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: write
    uses: ./.github/workflows/agent-review.lock.yml
    with:
      issue_number: ${{ inputs.issue_number }}
      pr_number: ${{ inputs.pr_number }}
      expected_head_sha: ${{ needs.implement-gate.outputs.head_sha }}
      transition_id: ${{ needs.ids.outputs.reviewer }}
      attempt: ${{ inputs.attempt }}
      approval_json: ${{ inputs.approval_json }}
    secrets: inherit

  review-gate:
    needs: [ids, implement-gate, review]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      decision: ${{ steps.gate.outputs.decision }}
      findings_json: ${{ steps.gate.outputs.findings_json }}
      blocker: ${{ steps.gate.outputs.blocker }}
    steps:
      - name: Check out trusted schemas
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: docs/agent-handoffs
          persist-credentials: false
      - name: Install JSON Schema validator
        run: npm install --no-save --no-audit --no-fund --ignore-scripts --prefix "$RUNNER_TEMP/agent-deps" ajv@8.17.1 ajv-formats@3.0.1
      - name: Download review evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: agent-review-${{ needs.ids.outputs.reviewer }}
          path: ${{ runner.temp }}/agent-review
      - name: Validate review handoff
        id: gate
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          PR_NUMBER: ${{ inputs.pr_number }}
          HEAD_SHA: ${{ needs.implement-gate.outputs.head_sha }}
          TRANSITION_ID: ${{ needs.ids.outputs.reviewer }}
        with:
          script: |
            const fs = require('fs');
            const deps = `${process.env.RUNNER_TEMP}/agent-deps/node_modules`;
            const Ajv = require(`${deps}/ajv/dist/2020`); const formats = require(`${deps}/ajv-formats`);
            const { owner, repo } = context.repo;
            const env = process.env;
            const fail = (message) => { throw new Error(message); };
            const validate = (doc, name) => {
              const ajv = new (Ajv.default || Ajv)({ allErrors: true, strict: false });
              (formats.default || formats)(ajv);
              const check = ajv.compile(JSON.parse(fs.readFileSync(`docs/agent-handoffs/${name}`, 'utf8')));
              if (!check(doc)) fail(`Invalid ${name}: ${ajv.errorsText(check.errors)}`);
            };
            try {
              // Artifact content is untrusted data: exact layout, bounded size, parsed only as JSON.
              const dir = `${env.RUNNER_TEMP}/agent-review`;
              const entries = fs.readdirSync(dir);
              if (entries.length !== 1 || entries[0] !== 'review-handoff.json') fail('Unexpected review artifact layout');
              const stat = fs.lstatSync(`${dir}/review-handoff.json`);
              if (!stat.isFile() || stat.size > 2 * 1024 * 1024) fail('Review artifact is not a bounded regular file');
              const report = JSON.parse(fs.readFileSync(`${dir}/review-handoff.json`, 'utf8'));
              validate(report, 'review.schema.json');
              const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: Number(env.PR_NUMBER) });
              if (pr.head.sha !== env.HEAD_SHA) fail('PR changed during review');
              if (report.transition_id !== env.TRANSITION_ID || report.reviewed_head_sha !== env.HEAD_SHA ||
                  report.issue_number !== Number(env.ISSUE_NUMBER) || report.pr_number !== pr.number)
                fail('Review report identity mismatch');
              const blocking = report.findings.some((f) => ['Blocker', 'Major'].includes(f.severity));
              if (report.decision === 'PASS' && blocking) fail('PASS contradicts blocking review findings');
              if (report.decision === 'REQUEST_CHANGES' && !blocking) fail('REQUEST_CHANGES lacks an actionable blocking finding');
              core.setOutput('decision', report.decision);
              core.setOutput('findings_json', JSON.stringify(report.findings));
            } catch (error) {
              core.setOutput('blocker', String(error.message).slice(0, 1000));
              core.setFailed(error.message);
            }
