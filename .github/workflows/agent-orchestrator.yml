name: Agent orchestrator

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  workflow_run:
    workflows: [Planner stage, Implementer stage, Reviewer stage, CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Originating issue number
        required: true
        type: string
      action:
        description: Coordinator action (plan starts a new planning revision)
        type: choice
        options: [reconcile, plan, recover, adopt]
        default: reconcile
      pr_number:
        description: Existing PR number, required only for adopt
        type: string
        default: "0"

permissions: {}

# Short controller runs serialize durable state writes. Workers have separate
# concurrency groups, so an environment approval cannot deadlock the controller.
concurrency:
  group: agent-orchestration-state-${{ github.repository }}
  cancel-in-progress: false

jobs:
  coordinate:
    if: >-
      (github.event_name == 'issues' && github.event.label.name == 'agent-lab') ||
      (github.event_name == 'issue_comment' && github.event.comment.user.type == 'User') ||
      github.event_name == 'pull_request_review' ||
      github.event_name == 'workflow_run' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: write
    steps:
      # workflow_run/issue content is untrusted data. Never check out its head
      # or execute producer artifacts in this write-capable job.
      - name: Check out trusted controller code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Install schema validator
        run: python3 -m pip install --disable-pip-version-check --target "$RUNNER_TEMP/agent-deps" -r scripts/requirements-agent-orchestration.txt
      - name: Validate state and route next action
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: ${{ runner.temp }}/agent-deps
        run: python3 scripts/agent_orchestrator.py
