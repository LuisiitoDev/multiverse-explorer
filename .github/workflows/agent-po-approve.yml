name: Product Owner approval
run-name: 'Product Owner approval · issue #${{ github.event.issue.number }}'

# Deterministic end of the Product Owner session. The human's exact
# `/po approve` comment approves the latest hash-signed draft published by
# agent-product-owner.md. This job (not the agent) rewrites the issue, swaps
# `po:idea` for `agent-lab` and dispatches agent-pipeline.yml. A label added
# with GITHUB_TOKEN does not trigger workflows, so the hand-off is an explicit
# workflow_dispatch that route re-verifies against this same approval.
on:
  issue_comment:
    types: [created]

permissions: {}

jobs:
  approve:
    if: >-
      !github.event.issue.pull_request &&
      github.event.comment.user.type == 'User' &&
      contains(github.event.issue.labels.*.name, 'po:idea') &&
      startsWith(github.event.comment.body, '/po approve')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Job-level so skipped runs from other comments never replace a pending approval.
    concurrency:
      group: po-approve-${{ github.event.issue.number }}
      cancel-in-progress: false
    permissions:
      actions: write
      issues: write
    steps:
      - name: Apply the approved draft and start the pipeline
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const crypto = require('crypto');
            const { owner, repo } = context.repo;
            const issue = context.payload.issue.number;
            const approval = context.payload.comment;
            const DRAFT = /^<!-- po-draft:v1 sha256=([0-9a-f]{64}) data=([A-Za-z0-9+/=]+) -->/;
            const reply = (body) => github.rest.issues.createComment({ owner, repo, issue_number: issue, body });
            try {
              if (approval.body.trim() !== '/po approve') throw new Error('Use exactly `/po approve` to approve the latest draft');
              const { data: permission } = await github.rest.repos.getCollaboratorPermissionLevel({ owner, repo, username: approval.user.login });
              if (!(['admin', 'maintain', 'write'].includes(permission.role_name) || ['admin', 'write'].includes(permission.permission))) {
                core.notice(`Ignored: ${approval.user.login} lacks repository write permission`);
                return;
              }
              const { data: live } = await github.rest.issues.get({ owner, repo, issue_number: issue });
              if (live.state !== 'open' || !live.labels.some((label) => label.name === 'po:idea')) {
                core.notice('Ignored: the Product Owner session on this issue is already closed');
                return;
              }
              const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: issue, per_page: 100 });
              const drafts = comments.filter((c) => c.id < approval.id && c.user.login === 'github-actions[bot]' && DRAFT.test(c.body));
              if (!drafts.length) throw new Error('There is no Product Owner draft to approve yet');
              const [, sha, data] = drafts[drafts.length - 1].body.match(DRAFT);
              const json = Buffer.from(data, 'base64').toString('utf8');
              if (crypto.createHash('sha256').update(json).digest('hex') !== sha) throw new Error('Draft integrity check failed');
              const draft = JSON.parse(json);
              if (typeof draft.title !== 'string' || !draft.title.startsWith('[Agent Lab] ') || typeof draft.body !== 'string')
                throw new Error('Draft has an unexpected shape');

              await github.rest.issues.update({ owner, repo, issue_number: issue, title: draft.title, body: draft.body });
              await github.rest.issues.removeLabel({ owner, repo, issue_number: issue, name: 'po:idea' }).catch((error) => {
                if (error.status !== 404) throw error;
              });
              await github.rest.issues.addLabels({ owner, repo, issue_number: issue, labels: ['agent-lab'] });
              await github.rest.actions.createWorkflowDispatch({ owner, repo, workflow_id: 'agent-pipeline.yml',
                ref: context.payload.repository.default_branch, inputs: { issue_number: String(issue) } });
              await reply(`Product Owner draft \`${sha.slice(0, 12)}\` approved by ${approval.user.login}. ` +
                'The issue now holds that exact text and the agent pipeline has been started.');
            } catch (error) {
              await reply(`Product Owner approval failed: ${error.message}`);
              core.setFailed(error.message);
            }
