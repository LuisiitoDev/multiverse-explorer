name: Backend Python

run-name: Backend Python checks

# Checks for the Python Favorites service (backend/favorites-api-py, epic #132). It is a workflow of its own because
# the `CI` workflow is disabled (issue #143). The path filter keeps it from running on unrelated changes.
# Do not add it to the required checks of the `main` ruleset while it has a path filter: a required check that does
# not run on a pull request blocks the merge. Decide that together with #143.
# It also runs when an EF migration changes: tests/test_schema_drift.py then asks for a new schema fixture.

on:
  pull_request:
    branches: [main]
    paths:
      - "backend/favorites-api-py/**"
      - "backend/src/Favorites.Infrastructure/Persistence/Migrations/**"
      - ".github/workflows/backend-python.yml"

  push:
    branches: [main]
    paths:
      - "backend/favorites-api-py/**"
      - "backend/src/Favorites.Infrastructure/Persistence/Migrations/**"
      - ".github/workflows/backend-python.yml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Python service
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: backend/favorites-api-py

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv
        # astral-sh/setup-uv v10.4.0, pinned by commit. The uv version equals the one in the Dockerfile.
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d
        with:
          version: "0.12.13"
          enable-cache: true
          cache-dependency-glob: backend/favorites-api-py/uv.lock

      - name: Install the driver's system libraries
        # mssql-python needs these three; the runner image may not have them.
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libltdl7 libkrb5-3 libgssapi-krb5-2
        working-directory: .

      - name: Start SQL Server for the integration tests
        # A throwaway password, made here and masked: nothing is committed.
        working-directory: .
        run: |
          password="A1a$(openssl rand -hex 12)"
          echo "::add-mask::$password"
          docker run -d --name mssql -e ACCEPT_EULA=Y -e "MSSQL_SA_PASSWORD=$password" \
            -p 1433:1433 mcr.microsoft.com/mssql/server:2022-latest
          echo "FAVORITES_TEST_DB_ADMIN=Server=localhost,1433;Database=master;User Id=sa;Password=$password;TrustServerCertificate=True;Encrypt=True" >> "$GITHUB_ENV"
          for attempt in $(seq 1 30); do
            if docker exec mssql /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$password" -C -Q "SELECT 1" >/dev/null 2>&1; then
              echo "SQL Server is ready"
              exit 0
            fi
            sleep 4
          done
          docker logs mssql
          echo "SQL Server did not become ready"
          exit 1

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy

      - name: Tests and coverage (minimum 80%)
        # With this variable a missing database fails the run instead of skipping the integration tests.
        env:
          FAVORITES_REQUIRE_INTEGRATION: "1"
        run: uv run pytest --cov --cov-report=term-missing

      - name: Build the image
        run: docker build --tag favorites-api-py:ci .
