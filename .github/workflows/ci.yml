name: CI

run-name: CI Rick And Morty

# CI runs on pull requests targeting main. It does not trigger on pushes to
# main -- CD calls it instead (see workflow_call below), so the checks run
# against the exact commit that is about to be deployed.
on:
  pull_request:
    branches: [main]

  # Lets CD reuse these jobs as its own gate.
  workflow_call:

  workflow_dispatch:

env:
  NODE_VERSION: 22

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Linter
        working-directory: frontend
        run: npm run lint

      - name: Run tests
        working-directory: frontend
        run: npm test

      - name: Build app
        working-directory: frontend
        run: npm run build

  analyze-code-sonarcloude:
    name: Analyze Static Code with SonarCloud
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # SonarCloud needs full history to diff against main for New Code.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # SonarCloud reads coverage from lcov, so it has to exist before the scan.
      - name: Run tests with coverage
        working-directory: frontend
        run: npm run test:coverage

      - name: Analyze Static Code with SonarCloud
        uses: SonarSource/sonarqube-scan-action@v6
        with:
          args: >
              -Dsonar.organization=luisiitodev
              -Dsonar.projectKey=luisiitodev
              -Dsonar.sources=.
              -Dsonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
              -Dsonar.coverage.exclusions=**/*.test.tsx,**/*.test.ts,**/test/**,frontend/src/main.tsx,**/*.config.ts
        env:
          GIT_HUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
