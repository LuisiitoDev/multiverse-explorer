name: CI

run-name: CI Rick And Morty

on:
  pull_request:
    branches: [main]

  push:
    branches: [main]

  workflow_dispatch: 

env:
  NODE_VERSION: 22
  DOTNET_VERSION: '10.0.x'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Linter
        working-directory: frontend
        run: npm run lint

      - name: Run tests
        working-directory: frontend
        run: npm test

      - name: Build app
        working-directory: frontend
        run: npm run build

  backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        working-directory: backend
        run: dotnet restore src/Favorites.Api/Favorites.Api.csproj

      - name: Build
        working-directory: backend
        run: dotnet build src/Favorites.Api/Favorites.Api.csproj --no-restore --configuration Release

      - name: Unit tests
        working-directory: backend
        run: dotnet test test/Favorites.UnitTests/Favorites.UnitTests.csproj --configuration Release

      - name: Integration tests
        working-directory: backend
        run: dotnet test test/Favorites.IntegrationTests/Favorites.IntegrationTests.csproj --configuration Release

  analyze-code-sonarcloude:
    name: Analyze Static Code with SonarCloud
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # SonarCloud needs full history to diff against main for New Code.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # SonarCloud reads coverage from lcov, so it has to exist before the scan.
      - name: Run tests with coverage
        working-directory: frontend
        run: npm run test:coverage

      - name: Analyze Static Code with SonarCloud
        uses: SonarSource/sonarqube-scan-action@v6
        with:
          args: >
              -Dsonar.organization=luisiitodev
              -Dsonar.projectKey=luisiitodev
              -Dsonar.sources=.
              -Dsonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
              -Dsonar.coverage.exclusions=**/*.test.tsx,**/*.test.ts,**/test/**,frontend/src/main.tsx,**/*.config.ts
        env:
          GIT_HUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
