name: CI

run-name: CI Rick And Morty

on:
  pull_request:
    branches: [main]

  workflow_dispatch: 

env:
  NODE_VERSION: 22

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Linter
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build app
        run: npm run build

  analyze-code-sonarcloude:
    name: Analyze Static Code with SonarCloud
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: Analyze Static Code with SonarCloud
        uses: SonarSource/sonarqube-scan-action@v5
        with:
          args: >
              -Dsonar.organization=luisiitodev
              -Dsonar.projectKey=luisiitodev
              -Dsonar.sources=.
        env:
          GIT_HUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
