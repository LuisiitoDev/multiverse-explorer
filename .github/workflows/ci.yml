name: CI

run-name: CI Rick And Morty

on:
  pull_request:
    branches: [main]

  push:
    branches: [main]

  workflow_dispatch: 

  # Reused by agent-pipeline.yml to validate the exact canonical PR head.
  workflow_call:
    inputs:
      ref:
        description: Commit SHA to validate (defaults to the triggering commit)
        required: false
        type: string
        default: ''

env:
  NODE_VERSION: 22
  DOTNET_VERSION: '10.0.x'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Linter
        working-directory: frontend
        run: npm run lint

      - name: Run tests
        working-directory: frontend
        run: npm test

      - name: Build app
        working-directory: frontend
        run: npm run build

  backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        working-directory: backend
        run: dotnet restore src/Favorites.Api/Favorites.Api.csproj

      - name: Build
        working-directory: backend
        run: dotnet build src/Favorites.Api/Favorites.Api.csproj --no-restore --configuration Release

      - name: Unit tests
        working-directory: backend
        run: dotnet test test/Favorites.UnitTests/Favorites.UnitTests.csproj --configuration Release

      - name: Integration tests
        working-directory: backend
        run: dotnet test test/Favorites.IntegrationTests/Favorites.IntegrationTests.csproj --configuration Release
