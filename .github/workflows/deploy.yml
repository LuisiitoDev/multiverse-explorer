name: Deploy to Production
run-name: Deploy to Production

on:
    workflow_run: 
        workflows: ["Publish Rick And Morty React as Image in Github Container Registry"]
        types:
            - completed

permissions:
    id-token: write
    contents: read

env:
    AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
    AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
    AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
    AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
    AZURE_CONTAINER_APP_NAME: ${{ vars.AZURE_CONTAINER_APP_NAME }}

jobs:
    Publish:
        runs-on: ubuntu-latest
        
        steps:
            - name: Log in to Azure using OIDC
              uses: azure/login@v2
              with:
                client-id: ${{ env.AZURE_CLIENT_ID }}
                tenant-id: ${{ env.AZURE_TENANT_ID }}
                subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

            - name: Deploy Image
              run: |
                az containerapp update \
                    --name "${{ env.AZURE_CONTAINER_APP_NAME }}" \
                    --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" \
                    --image "ghcr.io/${{ github.repository_owner }}/react-github-actions-demo:${{ github.event.workflow_run.head_sha }}"