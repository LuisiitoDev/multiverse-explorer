name: Deploy Infraestructure
run-name: Deploy Infraestructure

on:
    push: 
        branches:
            - main
        paths:
            - 'infra/**'
    workflow_dispatch:
        inputs:
            routeTrafficToLatestRevision:
                description: 'Bootstrap traffic to the newest revision. Leave false once CD owns the weights.'
                type: boolean
                default: false

permissions:
    id-token: write
    contents: read
    
env:
    AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
    AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
    AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
    AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
    AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
    APP_NAME: ${{ vars.APP_NAME }}

jobs:
    deploy:
        # Reads the image currently running so an infrastructure deploy never
        # replaces the application. The previous hardcoded hello-world image
        # would have wiped the running app on every run.
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Log in to Azure using OIDC
              uses: azure/login@v2
              with:
                client-id: ${{ env.AZURE_CLIENT_ID }}
                tenant-id: ${{ env.AZURE_TENANT_ID }}
                subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}


            - name: Resolve the currently deployed image
              id: image
              env:
                  APP_NAME: ${{ env.APP_NAME }}
                  RESOURCE_GROUP: ${{ env.AZURE_RESOURCE_GROUP }}
              run: |
                CURRENT=$(az containerapp show \
                    --name "$APP_NAME" \
                    --resource-group "$RESOURCE_GROUP" \
                    --query "properties.template.containers[0].image" -o tsv 2>/dev/null || true)

                if [ -z "$CURRENT" ]; then
                  # First ever deploy: nothing is running yet, so seed with the
                  # placeholder. CD replaces it on the next push.
                  CURRENT="mcr.microsoft.com/azuredocs/containerapps-helloworld:latest"
                  echo "No existing container app found; bootstrapping with the placeholder image."
                fi

                echo "Deploying with image: $CURRENT"
                echo "value=$CURRENT" >> "$GITHUB_OUTPUT"

            - name: Create resource group if not exits
              run: |
                az group create \
                    --name "${{ env.AZURE_RESOURCE_GROUP }}" \
                    --location "${{ env.AZURE_LOCATION }}"

            - name: Validate Bicep
              env:
                  APP_NAME: ${{ env.APP_NAME }}
                  RESOURCE_GROUP: ${{ env.AZURE_RESOURCE_GROUP }}
                  LOCATION: ${{ env.AZURE_LOCATION }}
                  CONTAINER_IMAGE: ${{ steps.image.outputs.value }}
                  ROUTE_TO_LATEST: ${{ inputs.routeTrafficToLatestRevision || false }}
              run: |
                az deployment group validate \
                    --resource-group "$RESOURCE_GROUP" \
                    --template-file infra/main.bicep \
                    --parameters \
                    location="$LOCATION" \
                    appName="$APP_NAME" \
                    containerImage="$CONTAINER_IMAGE" \
                    routeTrafficToLatestRevision="$ROUTE_TO_LATEST" \
                    --output none

            - name: Deploy Bicep
              env:
                  APP_NAME: ${{ env.APP_NAME }}
                  RESOURCE_GROUP: ${{ env.AZURE_RESOURCE_GROUP }}
                  LOCATION: ${{ env.AZURE_LOCATION }}
                  CONTAINER_IMAGE: ${{ steps.image.outputs.value }}
                  ROUTE_TO_LATEST: ${{ inputs.routeTrafficToLatestRevision || false }}
                  RUN_ID: ${{ github.run_id }}
              run: |
                az deployment group create \
                    --name "deploy-$RUN_ID" \
                    --resource-group "$RESOURCE_GROUP" \
                    --template-file infra/main.bicep \
                    --parameters \
                    location="$LOCATION" \
                    appName="$APP_NAME" \
                    containerImage="$CONTAINER_IMAGE" \
                    routeTrafficToLatestRevision="$ROUTE_TO_LATEST" \
                    --output json > deployment.json