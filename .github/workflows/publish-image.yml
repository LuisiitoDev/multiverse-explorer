name: Publish Rick And Morty React as Image in Github Container Registry

run-name: Publish Rick And Morty React as Image in Github Container Registry

on:
    workflow_run:
        workflows: ["CI Rick And Morty"]
        types:
            - completed
permissions: 
  contents: read
  packages: write
  id-token: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/react-github-actions-demo


jobs:
    publish:
        runs-on: ubuntu-latest
        if: github.event.workflow_run.conclusion == 'success'
        steps:
          - name: Checkout
            uses: actions/checkout@v4
            with:
              ref: ${{ github.event.workflow_run.head_sha }}

          - name: Log in to GHCR
            uses: docker/login-action@v3
            with:
              registry: ghcr.io
              username: ${{ github.actor }}
              password: ${{ secrets.GITHUB_TOKEN }}

          - name: Set image reference
            id: image
            run: echo "value=${IMAGE_NAME,,}:${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          
          - name: Set up Docker Buildx
            uses: docker/setup-buildx-action@v3

          - name: Build and push image
            uses: docker/build-push-action@v6
            with:
              context: .
              push: true
              tags: |
                ${{ steps.image.outputs.value }}
                ${{ env.IMAGE_NAME }}:latest
              labels: |
                org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
                org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}
              cache-from: type=gha
              cache-to: type=gha,mode=max

    
    

            
