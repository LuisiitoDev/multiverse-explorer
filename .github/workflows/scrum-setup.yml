name: Scrum Setup

run-name: Scrum Setup (${{ inputs.repository }})

# Runs scripts/scrum-setup.sh: labels, release milestones and, optionally, the Scrum Project and its fields.
# Idempotent: safe to run again. Views, Status options and Project workflows stay manual (docs/scrum.md, section 6).
#
# Labels and milestones use a short-lived GitHub App token (actions/create-github-app-token).
# Needs: variable SCRUM_APP_ID (client id or app id) and secret SCRUM_APP_KEY (private key) of an App installed on the
# repository with Issues: write.
#
# A GitHub App token cannot reach a Project owned by a user account. The Project steps run only when the optional
# secret SCRUM_PROJECT_TOKEN exists (classic PAT of the owner, scopes `repo` and `project`); otherwise they are skipped.

on:
  workflow_dispatch:
    inputs:
      repository:
        description: Repository to configure (owner/name)
        required: true
        default: LuisiitoDev/multiverse-explorer
      project_title:
        description: Title of the GitHub Project
        required: true
        default: "Multiverse Explorer: Scrum"
      sprint_start:
        description: Start date of Sprint 1 (YYYY-MM-DD). Empty means next Monday.
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: scrum-setup
  cancel-in-progress: false

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      REPOSITORY: ${{ inputs.repository }}
      PROJECT_TITLE: ${{ inputs.project_title }}
      SPRINT_START_INPUT: ${{ inputs.sprint_start }}
      HAS_PROJECT_TOKEN: ${{ secrets.SCRUM_PROJECT_TOKEN != '' }}
    steps:
      - name: Validate inputs
        run: |
          [[ "$REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] || { echo "::error::repository must be owner/name"; exit 1; }
          echo "OWNER=${REPOSITORY%%/*}" >> "$GITHUB_ENV"
          echo "REPO_NAME=${REPOSITORY#*/}" >> "$GITHUB_ENV"
          if [ -n "$SPRINT_START_INPUT" ]; then
            [[ "$SPRINT_START_INPUT" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "::error::sprint_start must be YYYY-MM-DD"; exit 1; }
            echo "SPRINT_START=$SPRINT_START_INPUT" >> "$GITHUB_ENV"
          fi
          if [ "$HAS_PROJECT_TOKEN" != "true" ]; then
            echo "SKIP_PROJECT=1" >> "$GITHUB_ENV"
            echo "::notice::SCRUM_PROJECT_TOKEN is not set: only labels and milestones will be created."
          fi

      - name: Create the App token
        id: app
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.SCRUM_APP_ID }}
          private-key: ${{ secrets.SCRUM_APP_KEY }}
          owner: ${{ env.OWNER }}
          repositories: ${{ env.REPO_NAME }}
          permission-issues: write
          permission-contents: read

      - name: Check out
        uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
          persist-credentials: false

      - name: Run scripts/scrum-setup.sh
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          PROJECT_GH_TOKEN: ${{ secrets.SCRUM_PROJECT_TOKEN }}
        run: scripts/scrum-setup.sh "$REPOSITORY" | tee -a "$GITHUB_STEP_SUMMARY"
