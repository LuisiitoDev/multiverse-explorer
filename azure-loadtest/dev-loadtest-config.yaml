version: v0.1
testId: multiverse-dev-loadtest
displayName: Multiverse Explorer - Dev pre-promotion load test
testPlan: dev-loadtest.jmx
description: Small, short load test against Dev. Gates promotion to Staging.

# Deliberately tiny: Dev/Staging/Prod share one F1 (Free) App Service Plan,
# so a heavy test here would also degrade Staging and Prod. This is meant to
# exercise the pipeline mechanism, not perform real load testing.
engineInstances: 1

env:
  - name: webapp_hostname
    value: rick-and-morty-dev-app-dev.azurewebsites.net
  - name: threads
    value: "3"
  - name: rampup
    value: "5"
  - name: duration
    value: "60"

# Same 2s threshold as the Dev response-time alert (azure-infra/dev/main.bicep)
# and the same spirit as the 5xx alert - keep the load test and the platform
# alerts speaking the same thresholds.
failureCriteria:
  - avg(response_time_ms)>2000
  - percentage(error)>5
