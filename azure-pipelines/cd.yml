trigger: none

pr: none

resources:
  pipelines:
    - pipeline: ci
      source: ci
      trigger: none

pool:
  vmImage: ubuntu-latest

variables:
  azureServiceConnection: rick-and-morty
  resourceGroup: rick-and-morty
  devAppServiceName: rick-and-morty-dev-app-dev
  stagingAppServiceName: rick-and-morty-staging-app-staging
  prodAppServiceName: rick-and-morty-prod-app-prod
  frontendPackage: $(Pipeline.Workspace)/ci/frontend/*.zip

stages:
  - stage: DeployDev
    displayName: Deploy to Dev

    jobs:
      - deployment: DeployDev
        displayName: Deploy Multiverse Explorer to Dev

        environment: multiverse-dev

        strategy:
          runOnce:
            deploy:
              steps:
                - download: ci
                  artifact: frontend

                - script: |
                    echo "Artifact downloaded successfully"
                    echo "Contents"
                    find "$(Pipeline.Workspace)/ci/frontend" -maxdepth 3 -type f
                  displayName: Inspect CI artifact

                - task: AzureWebApp@1
                  displayName: Deploy to Dev App Service
                  inputs:
                    azureSubscription: $(azureServiceConnection)
                    appType: webAppLinux
                    appName: $(devAppServiceName)
                    package: $(frontendPackage)

                - script: |
                    set -e
                    url="https://$(devAppServiceName).azurewebsites.net"
                    echo "Smoke testing $url"
                    status=$(curl -s -o /dev/null -w "%{http_code}" --retry 5 --retry-delay 10 --retry-connrefused "$url")
                    echo "HTTP status: $status"
                    if [ "$status" -lt 200 ] || [ "$status" -ge 400 ]; then
                      echo "Smoke test failed with status $status"
                      exit 1
                    fi
                    echo "Smoke test passed"
                  displayName: Smoke test - Dev

  - stage: DeployStaging
    displayName: Deploy to Staging
    dependsOn: DeployDev

    jobs:
      - deployment: DeployStaging
        displayName: Deploy Multiverse Explorer to Staging

        environment: multiverse-staging

        strategy:
          runOnce:
            deploy:
              steps:
                # Gate: block promotion to Staging if the Dev App Service's Azure Monitor
                # alert rules (http5xx-alert, response-time-alert - see azure-infra/dev/main.bicep)
                # are currently firing. Queries the Alerts Management API directly rather than
                # relying on an Environment check configured out-of-band in the ADO UI, so the
                # gate logic lives in this file.
                - task: AzureCLI@2
                  displayName: Gate - Query Azure Monitor alerts on Dev
                  inputs:
                    azureSubscription: $(azureServiceConnection)
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -e
                      subscriptionId=$(az account show --query id -o tsv)
                      resourceId="/subscriptions/$subscriptionId/resourceGroups/$(resourceGroup)/providers/Microsoft.Web/sites/$(devAppServiceName)"
                      alertsUrl="https://management.azure.com/subscriptions/$subscriptionId/providers/Microsoft.AlertsManagement/alerts?api-version=2019-05-05-preview&targetResource=$resourceId&monitorCondition=Fired"
                      fired=$(az rest --method get --url "$alertsUrl" --query "length(value)" -o tsv)
                      if [ "$fired" -gt 0 ]; then
                        echo "##vso[task.logissue type=error]$fired Azure Monitor alert(s) are firing on $(devAppServiceName); blocking promotion to Staging."
                        az rest --method get --url "$alertsUrl" --query "value[].properties.essentials.alertRule" -o tsv
                        exit 1
                      fi
                      echo "No firing alerts on $(devAppServiceName); promotion to Staging is clear."

                - download: ci
                  artifact: frontend

                - task: AzureWebApp@1
                  displayName: Deploy to Staging App Service
                  inputs:
                    azureSubscription: $(azureServiceConnection)
                    appType: webAppLinux
                    appName: $(stagingAppServiceName)
                    package: $(frontendPackage)

                - script: |
                    set -e
                    url="https://$(stagingAppServiceName).azurewebsites.net"
                    echo "Smoke testing $url"
                    status=$(curl -s -o /dev/null -w "%{http_code}" --retry 5 --retry-delay 10 --retry-connrefused "$url")
                    echo "HTTP status: $status"
                    if [ "$status" -lt 200 ] || [ "$status" -ge 400 ]; then
                      echo "Smoke test failed with status $status"
                      exit 1
                    fi
                    echo "Smoke test passed"
                  displayName: Smoke test - Staging

  - stage: DeployProd
    displayName: Deploy to Prod
    dependsOn: DeployStaging

    jobs:
      - deployment: DeployProd
        displayName: Deploy Multiverse Explorer to Prod

        # Azure DevOps Environment 'multiverse-prod' has a manual Approval check configured
        # in the UI (Project settings > Environments > multiverse-prod > Approvals and checks),
        # required before this job can start. That part isn't expressible as YAML syntax.
        environment: multiverse-prod

        strategy:
          runOnce:
            deploy:
              steps:
                # Gate: block promotion to Prod if the Staging App Service's Azure Monitor
                # alert rules (http5xx-alert, response-time-alert - see azure-infra/staging/main.bicep)
                # are currently firing.
                - task: AzureCLI@2
                  displayName: Gate - Query Azure Monitor alerts on Staging
                  inputs:
                    azureSubscription: $(azureServiceConnection)
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -e
                      subscriptionId=$(az account show --query id -o tsv)
                      resourceId="/subscriptions/$subscriptionId/resourceGroups/$(resourceGroup)/providers/Microsoft.Web/sites/$(stagingAppServiceName)"
                      alertsUrl="https://management.azure.com/subscriptions/$subscriptionId/providers/Microsoft.AlertsManagement/alerts?api-version=2019-05-05-preview&targetResource=$resourceId&monitorCondition=Fired"
                      fired=$(az rest --method get --url "$alertsUrl" --query "length(value)" -o tsv)
                      if [ "$fired" -gt 0 ]; then
                        echo "##vso[task.logissue type=error]$fired Azure Monitor alert(s) are firing on $(stagingAppServiceName); blocking promotion to Prod."
                        az rest --method get --url "$alertsUrl" --query "value[].properties.essentials.alertRule" -o tsv
                        exit 1
                      fi
                      echo "No firing alerts on $(stagingAppServiceName); promotion to Prod is clear."

                - download: ci
                  artifact: frontend

                - task: AzureWebApp@1
                  displayName: Deploy to Prod App Service
                  inputs:
                    azureSubscription: $(azureServiceConnection)
                    appType: webAppLinux
                    appName: $(prodAppServiceName)
                    package: $(frontendPackage)

                - script: |
                    set -e
                    url="https://$(prodAppServiceName).azurewebsites.net"
                    echo "Smoke testing $url"
                    status=$(curl -s -o /dev/null -w "%{http_code}" --retry 5 --retry-delay 10 --retry-connrefused "$url")
                    echo "HTTP status: $status"
                    if [ "$status" -lt 200 ] || [ "$status" -ge 400 ]; then
                      echo "Smoke test failed with status $status"
                      exit 1
                    fi
                    echo "Smoke test passed"
                  displayName: Smoke test - Prod
