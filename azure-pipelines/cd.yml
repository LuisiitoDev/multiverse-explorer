trigger: none

pr: none

resources:
  pipelines:
    - pipeline: ci
      source: ci
      trigger:
        branches:
          include:
            - main

pool:
  vmImage: ubuntu-latest

variables:
  azureServiceConnection: "rick-and-morty"
  # Docker Registry service connection pointing at ghcr.io, backed by a
  # GitHub PAT with package:write scope. Create this in Project Settings >
  # Service connections before running the pipeline.
  dockerRegistryServiceConnection: "ghcr-multiverse-explorer"
  # Same GHCR package the GitHub Actions workflow already publishes to.
  imageName: "ghcr.io/luisiitodev/react-github-actions-demo"
  resourceGroup: "rick-and-morty"
  appName: "rick-and-morty-prod-app"

stages:
  - stage: CD
    displayName: Continuous Deployment

    jobs:
      - job: Publish
        displayName: Publish Image

        steps:
          - checkout: self

          - task: Docker@2
            displayName: Log in to GHCR
            inputs:
              command: login
              containerRegistry: $(dockerRegistryServiceConnection)

          - task: Docker@2
            displayName: Build and push image
            inputs:
              command: buildAndPush
              containerRegistry: $(dockerRegistryServiceConnection)
              repository: $(imageName)
              Dockerfile: frontend/Dockerfile
              buildContext: frontend
              tags: |
                $(resources.pipeline.ci.sourceCommit)
                latest

          - bash: |
              set -e
              echo "##vso[task.setvariable variable=imageRef;isOutput=true]$(imageName):$(resources.pipeline.ci.sourceCommit)"
            name: setImage
            displayName: Set image reference

      - deployment: DeployCandidate
        displayName: Deploy Candidate Revision
        dependsOn: Publish
        environment: multiverse-prod

        variables:
          imageRef: $[ dependencies.Publish.outputs['setImage.imageRef'] ]

        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: none

                # Revision names are <app>--<suffix>. Without an explicit suffix
                # Azure generates a random hash, which cannot be targeted later
                # by 'ingress traffic set'. The build ID keeps the suffix unique
                # so re-running CD on the same commit does not collide with itself.
                - bash: |
                    set -e
                    SHORT_SHA=$(echo "$(resources.pipeline.ci.sourceCommit)" | cut -c1-7)
                    SUFFIX="c${SHORT_SHA}-$(Build.BuildId)"
                    echo "##vso[task.setvariable variable=REVISION_SUFFIX]$SUFFIX"
                    echo "##vso[task.setvariable variable=REVISION_NAME]$(appName)--$SUFFIX"
                  displayName: Compute revision name

                # In Multiple revisions mode with traffic pinned to a named
                # revision, a new revision is created with 0% traffic.
                # Deployed, but not released.
                - task: AzureCLI@2
                  displayName: Deploy candidate revision (0% traffic)
                  inputs:
                    azureSubscription: "$(azureServiceConnection)"
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -e
                      az containerapp update \
                          --name "$(appName)" \
                          --resource-group "$(resourceGroup)" \
                          --image "$(imageRef)" \
                          --revision-suffix "$(REVISION_SUFFIX)"

                # A label gives the candidate its own hostname without moving
                # any traffic, which is what makes it testable before real
                # users reach it.
                - task: AzureCLI@2
                  displayName: Label the candidate
                  inputs:
                    azureSubscription: "$(azureServiceConnection)"
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -e
                      az containerapp revision label add \
                          --name "$(appName)" \
                          --resource-group "$(resourceGroup)" \
                          --revision "$(REVISION_NAME)" \
                          --label canary

                - task: AzureCLI@2
                  displayName: Resolve URLs
                  inputs:
                    azureSubscription: "$(azureServiceConnection)"
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -e
                      FQDN=$(az containerapp show \
                          --name "$(appName)" \
                          --resource-group "$(resourceGroup)" \
                          --query properties.configuration.ingress.fqdn -o tsv)
                      echo "##vso[task.setvariable variable=PRODUCTION_URL]https://$FQDN"
                      echo "##vso[task.setvariable variable=CANARY_URL]https://${FQDN/$(appName)/$(appName)---canary}"

                # Fails the job if the candidate cannot serve its own root, so
                # a broken revision is caught here rather than after traffic
                # has been shifted.
                - bash: |
                    set -e
                    for attempt in 1 2 3 4 5 6; do
                      # minReplicas is 0, so the first request pays a cold start.
                      CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$(CANARY_URL)/" || echo 000)
                      echo "attempt $attempt: HTTP $CODE"
                      [ "$CODE" = "200" ] && exit 0
                      sleep 10
                    done
                    echo "Candidate did not return 200 at $(CANARY_URL)/" >&2
                    exit 1
                  displayName: Smoke test the candidate

                - bash: |
                    set -e
                    SUMMARY=$(mktemp)
                    {
                      echo "### Candidate revision deployed"
                      echo ""
                      echo "| | |"
                      echo "|---|---|"
                      echo "| Revision | \`$(REVISION_NAME)\` |"
                      echo "| Traffic | **0%** |"
                      echo "| Candidate URL | $(CANARY_URL) |"
                      echo "| Production URL | $(PRODUCTION_URL) |"
                      echo ""
                      echo "Traffic is unchanged. Run the **canary.yml** pipeline to shift a percentage to this revision."
                    } > "$SUMMARY"
                    echo "##vso[task.uploadsummary]$SUMMARY"
                  displayName: Summary
