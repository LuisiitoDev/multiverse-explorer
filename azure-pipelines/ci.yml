name: "Multiverse Explorer - CI $(Build.BuildId)"

pr:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

variables:
  nodeVersion: "22.x"

stages:
  - stage: CI
    displayName: Continuous Integration

    jobs:
      - job: BuildAndTest
        displayName: Build and Test

        steps:
          - checkout: self

          - task: UseNode@1
            inputs:
              version: $(nodeVersion)

          - task: Cache@2
            displayName: Cache npm
            inputs:
              key: 'npm | "$(Agent.OS)" | frontend/package-lock.json'
              restoreKeys: |
                npm | "$(Agent.OS)"
              path: $(Pipeline.Workspace)/.npm

          - script: npm ci
            workingDirectory: frontend
            displayName: Install dependencies
            env:
              npm_config_cache: $(Pipeline.Workspace)/.npm

          - script: npm run lint
            workingDirectory: frontend
            displayName: Lint

          - script: npm test
            workingDirectory: frontend
            displayName: Run tests

          - script: npm run build
            workingDirectory: frontend
            displayName: Build

      - job: analyze_static_code
        displayName: Analyze Static Code with SonarCloud
        dependsOn: BuildAndTest

        steps:
          - checkout: self
            fetchDepth: 0 # SonarCloud needs full history to diff against main for New Code.

          - task: UseNode@1
            inputs:
              version: $(nodeVersion)

          - script: npm ci
            workingDirectory: frontend
            displayName: Install dependencies

          - script: npm run test:coverage
            workingDirectory: frontend
            displayName: Run tests with coverage

          - task: SonarCloudPrepare@3
            inputs:
              SonarCloud: "SonarCloud"
              organization: "luisiitodev"
              scannerMode: "CLI"
              configMode: "manual"
              cliProjectKey: "luisiitodev"
              cliProjectName: "Multiverse Explorer"
              cliSources: "."
              extraProperties: |
                sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
                sonar.coverage.exclusions=**/*.test.tsx,**/*.test.ts,**/test/**,frontend/src/main.tsx,**/*.config.ts

          - task: SonarCloudAnalyze@3

          - task: SonarCloudPublish@3
            inputs:
              pollingTimeoutSec: "300"
