name: "Multiverse Explorer - CI $(Build.BuildId)"

pr:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

variables:
  nodeVersion: "22.x"

stages:
  - stage: CI
    displayName: Continuous Integration

    jobs:
      - job: BuildAndTest
        displayName: Build, Test, and Analyze

        steps:
          # 1. Checkout with full history required for SonarCloud pull request diffs
          - checkout: self
            fetchDepth: 0 

          - task: UseNode@1
            inputs:
              version: $(nodeVersion)

          - task: Cache@2
            displayName: Cache npm
            inputs:
              key: 'npm | "$(Agent.OS)" | frontend/package-lock.json'
              restoreKeys: |
                npm | "$(Agent.OS)"
              path: $(Pipeline.Workspace)/.npm

          # 2. STEP ONE: Initialize SonarCloud configuration BEFORE your code executes
          - task: SonarCloudPrepare@3
            displayName: 'Initialize SonarCloud'
            inputs:
              SonarCloud: "SonarQube"
              organization: "luisiitodev"
              scannerMode: "CLI"
              configMode: "manual"
              cliProjectKey: "luisiitodev"
              cliProjectName: "Multiverse Explorer"
              cliSources: "frontend"  # Pointing directly to your app root folder
              extraProperties: |
                sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
                sonar.coverage.exclusions=**/*.test.tsx,**/*.test.ts,**/test/**,frontend/src/main.tsx,**/*.config.ts

          # 3. Environment Pipeline Execution 
          - script: npm ci
            workingDirectory: frontend
            displayName: Install dependencies
            env:
              npm_config_cache: $(Pipeline.Workspace)/.npm

          - script: npm run lint
            workingDirectory: frontend
            displayName: Lint

          # Replaced "npm test" with your test coverage script so it generates the lcov.info file
          - script: npm run test:coverage
            workingDirectory: frontend
            displayName: Run tests with coverage

          - script: npm run build
            workingDirectory: frontend
            displayName: Build

          # 4. STEP TWO: Execute the analysis scan now that build & test files are ready
          - task: SonarCloudAnalyze@3
            displayName: 'Run SonarCloud Code Scan'

          # 5. STEP THREE: Push the results to the Azure DevOps build summary page
          - task: SonarCloudPublish@3
            displayName: 'Publish SonarCloud Quality Gate'
            inputs:
              pollingTimeoutSec: "300"
