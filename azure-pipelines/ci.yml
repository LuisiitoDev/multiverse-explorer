name: "Multiverse Explorer - CI $(Build.BuildId)"

pr:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

variables:
  nodeVersion: "22.x"

stages:
  - stage: CI
    displayName: Continuous Integration

    jobs:
      - job: BuildAndTest
        displayName: Build, Test, and Analyze

        steps:
          
          - checkout: self
            fetchDepth: 0 

          - task: UseNode@1
            inputs:
              version: $(nodeVersion)

          - task: Cache@2
            displayName: Cache npm
            inputs:
              key: 'npm | "$(Agent.OS)" | frontend/package-lock.json'
              restoreKeys: |
                npm | "$(Agent.OS)"
              path: $(Pipeline.Workspace)/.npm

          - task: SonarCloudPrepare@4
            displayName: 'Initialize SonarCloud'
            inputs:
              SonarCloud: "SonarQube"
              organization: "luisiitodev"
              scannerMode: "CLI"
              configMode: "manual"
              cliProjectKey: "luisiitodev"
              cliProjectName: "Multiverse Explorer"
              cliSources: "frontend"
              extraProperties: |
                sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
                sonar.coverage.exclusions=**/*.test.tsx,**/*.test.ts,**/test/**,frontend/src/main.tsx,**/*.config.ts

          - script: npm ci
            workingDirectory: frontend
            displayName: Install dependencies
            env:
              npm_config_cache: $(Pipeline.Workspace)/.npm

          - script: npm run lint
            workingDirectory: frontend
            displayName: Lint

          - script: npm run test:coverage
            workingDirectory: frontend
            displayName: Run tests with coverage

          - script: npm run build
            workingDirectory: frontend
            displayName: Build

          - task: SonarCloudAnalyze@4
            displayName: 'Run SonarCloud Code Scan'

          - task: SonarCloudPublish@4
            displayName: Publish SonarCloud Quality Gate
            condition: eq(variables['Build.SourceBranch'], 'refs/heads/main')
            inputs:
              pollingTimeoutSec: '300'
