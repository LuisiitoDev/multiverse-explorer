name: $(Build.DefinitionName)_$(SourceBranchName)_$(Date:yyyyMMdd).$(Rev:r)

pr:
    branches:
        include:
            - main

pool:
    vmImage: ubuntu-latest

variables:
    nodeVersion: '22.x'


stages:
    - stage: CI
      displayName: Continuous Integration

      jobs:
        - job: BuildAndTest
          displayName: Build and Test

          steps:
            - checkout: self

            - task: UseNode@1
              inputs:
                version: $(nodeVersion)
            
            - script: npm ci
              displayName: Install dependencies

            - script: npm run lint
              displayName: Lint

            - script: npm test
              displayName: Run tests

            - script: npm run build
              displayName: Buildß