                - task: AzureCLI@2
                  displayName: Validate Bicep
                  inputs:
                    azureSubscription: "$(azureServiceConnection)"
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -e
                      az deployment group validate \
