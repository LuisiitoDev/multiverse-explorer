  - stage: DeployProdInfra
    displayName: Deploy Prod Infra
    dependsOn: DeployStagingInfra

    jobs:
      - deployment: DeployProdInfra
        displayName: Deploy Prod Container App
        environment: multiverse-prod

        variables:
          appName: rick-and-morty-prod-app

        strategy:
          runOnce:
            deploy:
              steps:
                - checkout: self

                - task: AzureCLI@2
                  displayName: Resolve the currently deployed image
                  inputs:
                    azureSubscription: "$(azureServiceConnection)"
                    scriptType: bash
