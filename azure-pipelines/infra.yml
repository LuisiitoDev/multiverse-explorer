                            appName="$(appName)" \
                            containerImage="$(ContainerImage)" \
                            routeTrafficToLatestRevision=${{ lower(parameters.routeTrafficToLatestRevision) }} \
                          --output none

                - task: AzureCLI@2
                  displayName: Deploy Bicep
                  inputs:
                    azureSubscription: "$(azureServiceConnection)"
