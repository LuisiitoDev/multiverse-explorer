                      if [ -z "$CURRENT" ]; then
                        CURRENT="mcr.microsoft.com/azuredocs/containerapps-helloworld:latest"
                        echo "No existing container app found; bootstrapping with the placeholder image."
                      fi

                      echo "Deploying with image: $CURRENT"
                      echo "##vso[task.setvariable variable=ContainerImage]$CURRENT"

                - task: AzureCLI@2
                  displayName: Create resource group if not exists
                  inputs:
                    azureSubscription: "$(azureServiceConnection)"
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      set -e
